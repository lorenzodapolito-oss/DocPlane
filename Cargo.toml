[package]
name = "docplane"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "DocPlane: il lanciatore del pacchetto WordBook.it, SheetCalc.it e Flickdeck"
publish = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"

[dependencies]
egui = "0.36"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
rfd = "0.17"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
